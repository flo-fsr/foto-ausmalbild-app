<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foto-Ausmalbild</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Kreative Bildverarbeitung</p>
          <h1>Foto-Ausmalbild</h1>
        </div>
      </header>

      <main class="app-layout">
        <section class="panel controls-panel">
          <div class="section-header">
            <h2>1. Bild wählen</h2>
          </div>

          <div class="upload-row">
            <label class="btn primary" for="photoInput">Foto hochladen</label>
            <button class="btn secondary" id="cameraBtn" type="button">Kamera öffnen</button>
          </div>
          <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />

          <div id="cameraWrap" class="camera-panel hidden">
            <video id="camera" autoplay playsinline muted></video>
            <div class="camera-actions">
              <button class="btn accent" id="captureBtn" type="button">Foto aufnehmen</button>
              <button class="btn ghost" id="closeCameraBtn" type="button">Schließen</button>
            </div>
          </div>

          <div class="settings-block">
            <h3>Einstellungen</h3>
            <label>
              Kontrast
              <input id="contrast" type="range" min="80" max="220" value="150" />
            </label>
            <label>
              Detailstärke
              <input id="threshold" type="range" min="20" max="180" value="96" />
            </label>
            <label>
              Linienbreite
              <input id="lineWidth" type="range" min="0.6" max="2.5" step="0.1" value="1.2" />
            </label>
          </div>

          <div class="action-row">
            <button class="btn accent" id="generateBtn" type="button">Ausmalbild erzeugen</button>
            <button class="btn" id="downloadBtn" type="button">PNG speichern</button>
            <button class="btn" id="printBtn" type="button">Drucken</button>
          </div>
        </section>

        <section class="panel preview-panel">
          <div class="section-header">
            <h2>2. Vorschau</h2>
          </div>
          <div class="canvas-wrap">
            <canvas id="outputCanvas" width="900" height="900"></canvas>
          </div>
          <p class="helper-text">Die Ausgabe wird als schwarze Linien auf weißem Hintergrund erstellt – ideal zum Ausmalen oder Drucken.</p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
